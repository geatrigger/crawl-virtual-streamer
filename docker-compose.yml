version: "3"
services:
  mysql:
    # image: "mysql:5"
    image: "biarms/mysql:5.5.62-linux-arm32v7"
    container_name: mysql
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=testdb
    networks:
      - mysql-crawler
  mongo:
    image: "arm64v8/mongo:6"
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    # environment:
      # - MONGO_INITDB_DATABASE=virtual_streamer_gall
      # - MONGO_INITDB_ROOT_USERNAME=root
      # - MONGO_INITDB_ROOT_PASSWORD=password
      # - MONGODB_AUTH=true
      # - MONGODB_DATABASE=virtual_streamer_gall
      # - MONGODB_ROOT_USERNAME=root
      # - MONGODB_ROOT_PASSWORD=password
    networks:
      - mongo-crawler
  crawler:
    build: ./crawler
    container_name: crawler
    environment:
      - BOARD_STOP_MATCH_COUNT=80
      - RECENT_COMMENT_HISTORY_INTERVAL_SECONDS=600
      - RECENT_COMMENT_HISTORY_BOARD_COUNT=5
      - RECENT_COMMENT_HISTORY_POST_TARGET=100
    volumes:
      # - C:\crawl-virtual-streamer\crawler:/script
      - ./crawler:/script
    networks:
      - mysql-crawler
      - mongo-crawler
    working_dir: /script
    entrypoint: ./wait-for-it.sh mongo:27017 --timeout=15 -- python crawl.py
  analysis:
    build: ./analysis
    container_name: analysis
    ports:
      - "8888:8888"
    volumes:
      - ./analysis:/jovyan/work
    networks:
      - mysql-crawler
      - mongo-crawler
    entrypoint: jupyter-notebook --ip="*" --no-browser --allow-root
    expose:
      - "8888"

networks:
  mysql-crawler:
  mongo-crawler:

volumes:
  mysql-data:
  mongo_data:
  mongo_config:
